<html>
<head>
<style type="text/css">
body {
  background: #333333;
}
video {
  width: 30%;
  border: 1px solid white;
}
</style>
<script type="text/javascript">

var videos = new Array(9);
videos[0] = 'assets/test.mp4';
videos[1] = 'assets/test.mp4';
videos[2] = 'assets/test.mp4';
videos[3] = 'assets/test.mp4';
videos[4] = 'assets/test.mp4';
videos[5] = 'assets/test.mp4';
videos[6] = 'assets/test.mp4';
videos[7] = 'assets/test.mp4';
videos[8] = 'assets/test.mp4';

for (i=0; i < videos.length; i++) {
  document.writeln('<video loop nocontrols muted class="video ' + i  + '" src="' + videos[i] + '"></video>');
}
</script>
</head>
<body>

<button id="stop">Stop All</button>
<button id="play">Play All</button>
<button id="sync">Sync All</button>

<script type="text/javascript">

window.addEventListener("load", function() {
  const vids = document.querySelectorAll("video");
  const stop = document.getElementById("stop");
  const play = document.getElementById("play");
  stop.addEventListener("click", function() {
    console.log(vids);
    for(const v of vids) {
      console.log("stopping " + v.className);
      v.pause();
    }
  });
  play.addEventListener("click", function() {
    console.log(vids);
    for(const v of vids) {
      console.log("playing " + v.className);
      v.play();
    }
  });
  sync.addEventListener("click", function() {
    for(const v of vids) {
      console.log("syncing " + v);
      v.currentTime = 0;
    }
  });
});
</script>
</body>
</html>
