<html>
<head>

<link rel="stylesheet" type="text/css" href="style.css" media="screen">

<script type="text/javascript" src="individual.js"></script>
<script type="text/javascript" src="reverse.js"></script>
<script type="text/javascript" src="random.js"></script>
<script type="text/javascript" src="snake.js"></script>

<script type="text/javascript">
// Default variables.
const src = 'assets/test.mp4';
var w = 640;
var h = 360;
const fps = 30;
var gridWidth = 5;
var gridHeight = 4;
var b = 10; // bezel (border) size.

// Global variables.
var vid;
var canvas;
var context;
var source;
var target;
var timer;

function computeSourceMatrix(cols, rows) {
  // Source.

  // Source matrix.
  var source = new Array(cols * rows);
  var i = 0;
  for(y=0; y < rows; y++) {
    for(x=0; x < cols; x++) {
      source[i] = [x * w / cols , y * h / rows, w / cols, h / rows];
      i++;
    }
  }

  //source[0] = [0, 		0, 		w_1_3,	 		h_1_3];
  //source[1] = [w_1_3, 	0, 		w_1_3,			h_1_3];
  //source[2] = [w_2_3,		0,		w_1_3,			h_1_3];
  //source[3] = [0,		h_1_3,		w_1_3,	 		h_1_3];
  //source[4] = [w_1_3,		h_1_3,		w_1_3,			h_1_3];
  //source[5] = [w_2_3,		h_1_3,		w_1_3,			h_1_3];
  //source[6] = [0,		h_2_3,		w_1_3,			h_1_3];
  //source[7] = [w_1_3,		h_2_3,		w_1_3,			h_1_3];
  //source[8] = [w_2_3,		h_2_3,		w_1_3,			h_1_3];

  return source;
}

function computeTargetMatrix(cols, rows) {
  // Target.
  var cw = window.innerWidth - b * (cols - 1);
  var ch = window.innerHeight - b * (rows - 1);

  // Target matrix.
  var target = new Array(cols * rows);
  var i = 0;
  for(y=0; y < rows; y++) {
    for(x=0; x < cols; x++) {
      target[i] = [x * b + x * cw / cols , y * b + y * ch / rows, cw / cols, ch / rows];
      i++;
    }
  }

  //var target = new Array(9);
  //target[0] = [b, 			b, 			cw_1_3,			ch_1_3];
  //target[1] = [2 * b + cw_1_3, 	b, 			cw_1_3,			ch_1_3];
  //target[2] = [3 * b + cw_2_3,	b,			cw_1_3,			ch_1_3];
  //target[3] = [b,			2 * b + ch_1_3,		cw_1_3, 		ch_1_3];
  //target[4] = [2 * b + cw_1_3,	2 * b + ch_1_3,		cw_1_3,			ch_1_3];
  //target[5] = [3 * b + cw_2_3,	2 * b + ch_1_3,		cw_1_3,			ch_1_3];
  //target[6] = [b,			3 * b + ch_2_3,		cw_1_3,			ch_1_3];
  //target[7] = [2 * b + cw_1_3,	3 * b + ch_2_3,		cw_1_3,			ch_1_3];
  //target[8] = [3 * b + cw_2_3,	3 * b + ch_2_3,		cw_1_3,			ch_1_3];

  return target;
}

function updateGridSize(e) {
  if (parseInt(e.target.value) > 1) {
    val = parseInt(e.target.value);
  }
  else {
    return false;
  }
  if (e.target.id == "width") {
    gridWidth = val;
  }
  else if (e.target.id == "height") {
    gridHeight = val;
  }
  context.fillRect(0, 0, canvas.width, canvas.height);
  source = computeSourceMatrix(gridWidth, gridHeight);
  target = computeTargetMatrix(gridWidth, gridHeight);
}

function run() {
  timer = setInterval(function() {
    for (i=0; i < source.length; i++) {
      context.drawImage(vid, source[i][0], source[i][1], source[i][2], source[i][3], target[i][0], target[i][1], target[i][2], target[i][3]);
    }
  }, 1000 / fps);
}

window.addEventListener("load", function() {

  // Initialize grid matrices.
  source = computeSourceMatrix(gridWidth, gridHeight);
  target = computeTargetMatrix(gridWidth, gridHeight);

  // Setup elements.
  vid = document.querySelector("video");
  vid.src = src;
  const stop = document.getElementById("stop");
  const play = document.getElementById("play");
  canvas = document.getElementById("canvas");
  context = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  vid_src.value = src;
  load.addEventListener("click", function() {
    clearTimeout(timer);
    context.fillRect(0, 0, canvas.width, canvas.height);
    vid.src = vid_src.value;
    vid.load();
  });
  vid.addEventListener("loadedmetadata", function() {
    w = vid.videoWidth;
    h = vid.videoHeight;
    source = computeSourceMatrix(gridWidth, gridHeight);
  });

  stop.addEventListener("click", function() {
    console.log("stopping " + vid.className);
    clearInterval(timer);
    vid.pause();
  });
  play.addEventListener("click", function() {
    console.log("playing " + vid.className);
    vid.play();
  });
  hide.addEventListener("click", function() {
    other.style.display = 'none';
  });
  canvas.addEventListener("click", function() {
    other.style.display = 'unset';
  });

  width.value = gridWidth;
  height.value = gridHeight;
  width.addEventListener("input", updateGridSize);
  height.addEventListener("input", updateGridSize);

  vid.addEventListener("play", function() {
    if (vid.paused || vid.ended) {
      clearInterval(timer);
      return false;
    }
    run();
  });

});

window.addEventListener("resize", function(e) {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  context.fillRect(0, 0, canvas.width, canvas.height);
  // compute target matrix.
  target = computeTargetMatrix(gridWidth, gridHeight);
});
</script>
</head>

<body>
<div id="other">
  <input type="text" id="vid_src" size="64" />
  <button id="load">Load</button>
  <video loop controls muted></video>

  <p>Grid Width: <input type="number" id="width" /></p>
  <p>Grid Height: <input type="number" id="height" /></p>

  <button id="stop">Stop All</button>
  <button id="play">Play All</button>
  <button id="hide">Hide controls</button>

  <p>Effects:</p>
</div>

<canvas id="canvas"></canvas>

</body>
</html>
